services:
  webshell-sandbox-image:
    build: ./sandbox
    image: websh-sandbox:latest
    scale: 0

  webshell:
    image: ghcr.io/janbellon/webshell:v0.1.0
    container_name: webshell
    labels:
      caddy: shell.example.com
      caddy.tls: /certs/example.com/fullchain.pem /certs/example.com/privkey.pem
      caddy.reverse_proxy: "http://webshell:3000"
    depends_on:
      - webshell-sandbox-image
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - caddy
    environment:
      SANDBOX_IMAGE: websh-sandbox:latest
      MAX_CONTAINERS_PER_IP: "10"
      MAX_CONTAINERS_TOTAL: "50"
      SANDBOX_MEMORY: 256m
      SANDBOX_CPUS: "0.5"
      SANDBOX_PIDS: "128"
      SANDBOX_NETWORK: none
      SESSION_MAX_SECONDS: "1800"
      SESSION_IDLE_SECONDS: "600"
      TRUST_PROXY: "true"
      ALLOWED_ORIGINS: https://shell.example.com
    restart: unless-stopped
    stop_grace_period: 20s

networks:
  caddy:
    external: true
