<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web Shell - disposable Linux terminal</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="vendor/xterm.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <span class="dot"></span>
        <span class="name">websh</span>
        <span class="sub">Alpine Linux · disposable container</span>
      </div>
      <div class="meta">
        <span id="container" class="mono" hidden></span>
        <span id="timer" class="mono" hidden></span>
        <span id="status" class="pill" data-state="connecting">Connecting…</span>
        <button id="restart" type="button" hidden>New session</button>
      </div>
    </header>

    <main class="stage">
      <div id="terminal"></div>
      <div id="notice" class="notice" hidden>
        <p id="notice-text"></p>
        <button id="notice-retry" type="button">Retry</button>
      </div>
    </main>

    <footer class="foot">
      The container is destroyed as soon as you leave the page. Nothing is kept.
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
