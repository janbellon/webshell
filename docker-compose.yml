services:
  webshell-sandbox-image:
    build: ./sandbox
    image: websh-sandbox:latest
    scale: 0

  webshell:
    build: ./server
    image: websh-server:latest
    container_name: webshell
    labels:
      caddy: shell.int.enpos.fr
      caddy.tls: /certs/int.enpos.fr/fullchain.pem /certs/int.enpos.fr/privkey.pem
      caddy.reverse_proxy: "http://webshell:3000"
    depends_on:
      - webshell-sandbox-image
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - caddy
    environment:
      SANDBOX_IMAGE: websh-sandbox:latest
      MAX_CONTAINERS_PER_IP: "10"
      MAX_CONTAINERS_TOTAL: "50"
      SANDBOX_MEMORY: 256m
      SANDBOX_CPUS: "0.5"
      SANDBOX_PIDS: "128"
      SANDBOX_NETWORK: none        # pas d'accès réseau depuis les bacs à sable
      SESSION_MAX_SECONDS: "1800"  # 30 min max par session
      SESSION_IDLE_SECONDS: "600"  # 10 min sans frappe => fermeture
      TRUST_PROXY: "false"         # "true" derrière nginx/traefik
      ALLOWED_ORIGINS: https://shell.int.enpos.fr
      # SANDBOX_RUNTIME: runsc     # gVisor, si installé sur l'hôte
    restart: unless-stopped
    # Laisse le temps de supprimer les conteneurs à l'arrêt
    stop_grace_period: 20s

networks:
  caddy:
    external: true
